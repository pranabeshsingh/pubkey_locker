name: 🧪 CI - Quality, Build & Security

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  quality:
    name: 🧪 Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Syntax check
        run: |
          for f in src/*.js public/app.js; do
            node --check "$f"
          done

      - name: 🧹 Lint
        run: npm run lint

      - name: 🎨 Format check
        run: npm run format

      - name: 🧪 Tests
        run: npm test

      - name: 🕵️ Secret scan
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)wallet/|\.pem$|\.p12$|\.jks$'; then
            echo "Tracked secret or wallet file found"
            exit 1
          fi
          if grep -RInE 'ORACLE_PASSWORD|ADMIN_TOKEN|PRIVATE KEY|BEGIN .*PRIVATE KEY' --exclude-dir=.git --exclude='*.md' --exclude='.env.example' .; then
            echo "Potential secret found in tracked files"
            exit 1
          fi

  security:
    name: 🛡️ Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔐 Dependency audit
        run: npm audit --audit-level=high

  build:
    name: 📦 Build Artifact
    needs: [quality, security]
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Create deploy archive
        run: |
          tar -czf pubkey-locker.tar.gz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            --exclude='./wallet' \
            --exclude='./scripts/deploy-vm.sh' \
            .

      - name: ⬆️ Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pubkey-locker
          path: pubkey-locker.tar.gz
          retention-days: 7
