name: 🚀 Deploy to Oracle VM

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 📦 Create deploy archive
        run: |
          tar -czf pubkey-locker.tar.gz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./.env' \
            --exclude='./wallet' \
            --exclude='./scripts/deploy-vm.sh' \
            .

      - name: 🔧 Install SSH tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: 🚚 Upload archive
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            pubkey-locker.tar.gz \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}:/tmp/pubkey-locker-deploy.tar.gz"

      - name: 🛠️ Extract and restart
        env:
          SSHPASS: ${{ secrets.VM_PASSWORD }}
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            "${{ secrets.VM_USER }}@${{ secrets.VM_HOST }}" "
              set -e
              sudo mkdir -p '${{ secrets.VM_APP_DIR }}'
              sudo chown -R '${{ secrets.VM_USER }}:${{ secrets.VM_USER }}' '${{ secrets.VM_APP_DIR }}'
              cd '${{ secrets.VM_APP_DIR }}'
              tar -xzf /tmp/pubkey-locker-deploy.tar.gz
              sudo systemctl restart pubkey-locker
              sleep 3
              sudo systemctl is-active --quiet pubkey-locker
            "

      - name: 🩺 Health check
        run: |
          curl -fsS "https://pubkey.locker/health"

      - name: ✅ Deployment summary
        run: |
          echo "Deployed commit ${GITHUB_SHA} to https://pubkey.locker"