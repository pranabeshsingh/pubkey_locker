<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin · pubkey.locker</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/">pubkey<span>.locker</span></a>
        <nav class="nav">
          <a href="/">Home</a>
          <a href="/docs.html">Docs</a>
          <a href="/admin.html" class="active">Admin</a>
          <a class="btn-nav" href="https://github.com/pranabeshsingh/pubkey_locker" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="section">
        <div class="panel">
          <div class="panel-header">
            <h2>Admin console</h2>
            <p>Protected by admin token. View and remove stored bundles.</p>
          </div>
          <div class="inline-form">
            <input id="admin-token" type="password" placeholder="Admin token" />
            <button id="admin-load-btn" class="btn btn-primary">Load bundles</button>
          </div>
          <p id="admin-status" class="status"></p>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Handle</th><th>ID</th><th>Created</th><th>Action</th></tr>
              </thead>
              <tbody id="admin-rows"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container">
        <div class="footer-bottom">
          <span>© pubkey.locker</span>
          <a href="https://github.com/pranabeshsingh/pubkey_locker" target="_blank" rel="noreferrer">GitHub</a>
        </div>
      </div>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
